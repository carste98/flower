<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Till Alva</title>
  <meta name="description" content="En romantisk bukettsida till Alva med blomning och körsbärstema." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grain"></div>
  <div class="glow glow-left"></div>
  <div class="glow glow-right"></div>

  <main class="card">
    <header class="hero">
      <p class="tag">En liten bukett, skapad med kärlek</p>
      <h1>Alva</h1>
      <p class="subtitle">Du får vanliga dagar att blomma.</p>
    </header>

    <section class="bouquet" aria-label="Dekorativ bukett med körsbär">
      <div class="wrap"></div>

      <div class="stem stem-1"></div>
      <div class="stem stem-2"></div>
      <div class="stem stem-3"></div>
      <div class="stem stem-4"></div>
      <div class="stem stem-5"></div>
      <div class="stem stem-6"></div>
      <div class="stem stem-7"></div>
      <div class="stem stem-8"></div>

      <div class="flower rose rose-1"></div>
      <div class="flower daisy daisy-1"></div>
      <div class="flower rose rose-2"></div>
      <div class="flower tulip tulip-1"></div>
      <div class="flower daisy daisy-2"></div>
      <div class="flower rose rose-3"></div>
      <div class="flower tulip tulip-2"></div>
      <div class="flower daisy daisy-3"></div>
      <div class="flower blossom blossom-1"></div>
      <div class="flower blossom blossom-2"></div>
      <div class="flower blossom blossom-3"></div>

      <div class="cherry-branch cherry-branch-1">
        <span class="twig"></span>
        <span class="cherry cherry-a"></span>
        <span class="cherry cherry-b"></span>
        <span class="leaf leaf-a"></span>
      </div>

      <div class="cherry-branch cherry-branch-2">
        <span class="twig"></span>
        <span class="cherry cherry-a"></span>
        <span class="cherry cherry-b"></span>
        <span class="leaf leaf-a"></span>
      </div>
    </section>

    <section class="note">
      <p>
        Som Bärgarn i Bilar: lugn, rolig och alltid där när det behövs.
        Du får allt att kännas lite bättre.
      </p>
    </section>

    <button class="bloom-btn" id="bloomButton" type="button">Låt Buketten Blomma</button>
  </main>

  <section class="tow-scene" aria-label="Animerad bärgarbil">
    <div class="tow-truck" role="img" aria-label="Bärgarbil som kör förbi">
      <div class="truck-body">
        <span class="window"></span>
        <span class="headlight"></span>
      </div>
      <div class="truck-arm"></div>
      <div class="wheel wheel-front"></div>
      <div class="wheel wheel-back"></div>
    </div>
  </section>

  <div class="petals" id="petals" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
